<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASAM — Master AI Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c:#00e5ff;--p:#a855f7;--pk:#f000ff;
  --dk:#020c1b;--dk2:#040f22;
  --gl:rgba(0,229,255,0.07);--gl2:rgba(168,85,247,0.08);
  --b:rgba(0,229,255,0.2);--b2:rgba(168,85,247,0.25);
  --t:#cce8ff;--t2:rgba(180,220,255,0.6);
  --sc:0 0 22px rgba(0,229,255,0.5);--sp:0 0 22px rgba(168,85,247,0.5);
}
html,body{height:100%;overflow:hidden}
body{background:var(--dk);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{display:flex;height:100vh;position:relative;z-index:1}

/* ── LEFT ── */
.lp{width:255px;flex-shrink:0;background:rgba(4,15,34,0.97);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:18px 16px;border-bottom:1px solid var(--b);text-align:center;background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(168,85,247,.06))}
.bname{font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,var(--c),var(--p),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bsub{font-size:9px;color:var(--t2);letter-spacing:2px;margin-top:3px;text-transform:uppercase}
.bonline{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;color:var(--c)}
.bdot{width:6px;height:6px;background:var(--c);border-radius:50%;box-shadow:var(--sc);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ltabs{display:flex;border-bottom:1px solid var(--b)}
.ltab{flex:1;padding:10px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--t2);cursor:pointer;font-size:11px;font-weight:700;transition:all .2s;letter-spacing:.5px}
.ltab.on{color:var(--c);border-bottom-color:var(--c);background:rgba(0,229,255,.04)}
.lbody{flex:1;overflow-y:auto;padding:12px}
.lbody::-webkit-scrollbar{width:3px}
.lbody::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.ac{background:var(--gl);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer;transition:all .2s}
.ac:hover,.ac.on{background:rgba(0,229,255,.12);border-color:var(--c);transform:translateX(3px);box-shadow:var(--sc)}
.ac-h{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.ac-ico{font-size:17px}
.ac-nm{font-size:12px;color:var(--c);font-weight:700}
.ac-ds{font-size:10px;color:var(--t2)}
.badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;font-weight:700;margin-top:5px;margin-right:4px}
.b-ok{background:rgba(0,255,136,.1);color:#00ff88;border:1px solid rgba(0,255,136,.3)}
.b-no{background:rgba(255,180,0,.1);color:#ffb800;border:1px solid rgba(255,180,0,.3)}
.b-free{background:rgba(0,229,255,.08);color:var(--c);border:1px solid var(--b)}

/* ── CENTER ── */
.cc{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:12px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b);background:linear-gradient(135deg,rgba(0,229,255,.06),rgba(168,85,247,.06));flex-shrink:0}
.tbtitle{font-size:16px;font-weight:700;color:var(--c);letter-spacing:1px}
.tctrls{display:flex;gap:7px;align-items:center}
.wavewrap{display:none;align-items:center;gap:3px}
.wavewrap.on{display:flex}
.wbar{width:3px;border-radius:2px;background:var(--c);box-shadow:0 0 5px var(--c);animation:wb 1s ease-in-out infinite}
.wbar:nth-child(1){height:5px}.wbar:nth-child(2){height:12px;animation-delay:.1s}.wbar:nth-child(3){height:18px;animation-delay:.2s}.wbar:nth-child(4){height:12px;animation-delay:.3s}.wbar:nth-child(5){height:5px;animation-delay:.4s}
@keyframes wb{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.vpill{display:flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--b);border-radius:16px;background:var(--gl);cursor:pointer;transition:all .2s;font-size:11px;color:var(--t2)}
.vpill:hover{border-color:var(--c);color:var(--c)}
.vpill.on{border-color:var(--c);color:var(--c);background:rgba(0,229,255,.1);box-shadow:var(--sc)}
.vpdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .2s;flex-shrink:0}
.vpill.on .vpdot{background:var(--c);box-shadow:0 0 7px var(--c)}
.tbtn{width:34px;height:34px;border:1px solid var(--b);background:var(--gl);color:var(--t2);border-radius:50%;cursor:pointer;transition:all .2s;font-size:13px;display:flex;align-items:center;justify-content:center}
.tbtn:hover{border-color:var(--c);color:var(--c);box-shadow:var(--sc)}

/* ORB */
.orbzone{height:185px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;background:linear-gradient(180deg,rgba(0,229,255,.02),transparent)}
.orbwrap{position:relative;width:155px;height:155px}
#orbC{position:absolute;inset:0;border-radius:50%}
.oring{position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(0,229,255,.18);animation:oring 4s linear infinite}
.oring2{position:absolute;inset:-22px;border-radius:50%;border:1px dashed rgba(168,85,247,.2);animation:oring 7s linear infinite reverse}
@keyframes oring{to{transform:rotate(360deg)}}
.olabel{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--t2);letter-spacing:2px;white-space:nowrap}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:13px}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.msg{display:flex;animation:min .35s ease-out}
@keyframes min{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.u{justify-content:flex-end}
.msg.a{justify-content:flex-start}
.bub{max-width:67%;padding:11px 15px;border-radius:13px;line-height:1.65;font-size:13px;word-break:break-word;white-space:pre-wrap;position:relative}
.msg.u .bub{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(168,85,247,.2));border:1px solid rgba(0,229,255,.35);color:var(--t)}
.msg.a .bub{background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.2);color:#c0e8ff}
.bub-agent{font-size:10px;color:var(--c);font-weight:700;margin-bottom:5px;opacity:.75;letter-spacing:.5px}
.rbtn{position:absolute;bottom:-9px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--dk);border:1px solid rgba(0,229,255,.3);color:rgba(0,229,255,.6);font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .2s}
.msg.a .bub:hover .rbtn{opacity:1}
.rbtn.on{opacity:1;color:var(--c);animation:blink 1s infinite}
.tdots{display:flex;gap:4px;padding:12px 15px;align-items:center}
.td{width:7px;height:7px;background:var(--c);border-radius:50%;box-shadow:var(--sc);animation:td 1.4s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

/* Input */
.ibar{padding:12px 16px;border-top:1px solid var(--b);background:rgba(4,15,34,.95);display:flex;gap:8px;align-items:center;flex-shrink:0}
#inp{flex:1;padding:10px 14px;background:rgba(0,229,255,.04);border:1px solid var(--b);border-radius:9px;color:var(--c);font-size:13px;outline:none;transition:all .2s;-webkit-user-select:text;user-select:text}
#inp:focus{background:rgba(0,229,255,.08);border-color:var(--c);box-shadow:0 0 0 2px rgba(0,229,255,.1)}
#inp::placeholder{color:rgba(0,229,255,.28)}
#inp.micon{border-color:#ff4040;animation:mpulse 1s infinite}
@keyframes mpulse{0%,100%{background:rgba(255,64,64,.04)}50%{background:rgba(255,64,64,.1)}}
.ibtn{width:38px;height:38px;border:1px solid var(--b);background:var(--gl);color:var(--t2);border-radius:50%;cursor:pointer;transition:all .2s;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn:hover{border-color:var(--c);color:var(--c);box-shadow:var(--sc);transform:scale(1.08)}
.ibtn:disabled{opacity:.3;cursor:not-allowed;transform:none!important}
.ibtn.mic.on{border-color:#ff4040;color:#ff4040;background:rgba(255,64,64,.12);box-shadow:0 0 14px rgba(255,64,64,.4);animation:mpulse 1s infinite}
.ibtn.send{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(168,85,247,.25));border-color:var(--p);color:var(--c)}
.ibtn.send:hover{box-shadow:var(--sp)}

/* ── RIGHT ── */
.rp{width:255px;flex-shrink:0;background:rgba(4,15,34,.97);border-left:1px solid var(--b2);display:flex;flex-direction:column;overflow:hidden}
.rphead{padding:16px;border-bottom:1px solid var(--b2);background:linear-gradient(135deg,rgba(168,85,247,.07),rgba(240,0,255,.03))}
.rphtitle{font-size:13px;color:var(--p);font-weight:700;letter-spacing:1px}
.rptabs{display:flex;border-bottom:1px solid var(--b2)}
.rptab{flex:1;padding:9px 4px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--t2);cursor:pointer;font-size:11px;font-weight:700;transition:all .2s}
.rptab.on{color:var(--p);border-bottom-color:var(--p);background:rgba(168,85,247,.04)}
.rpbody{flex:1;overflow-y:auto;padding:13px}
.rpbody::-webkit-scrollbar{width:3px}
.rpbody::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.rc{background:var(--gl2);border:1px solid var(--b2);border-radius:9px;padding:11px;margin-bottom:9px;transition:all .2s}
.rc:hover{background:rgba(168,85,247,.15);border-color:var(--p)}
.rl{font-size:10px;color:var(--p);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.rv{font-size:12px;color:var(--t2);line-height:1.5;word-break:break-word}
.rv.bright{color:var(--t);font-weight:600}
.oimg{width:100%;border-radius:7px;border:1px solid var(--b2);margin-top:6px;display:block}
.vsl-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.vsl-lab{font-size:10px;color:var(--t2);width:40px;flex-shrink:0}
.vsl{flex:1;height:3px;appearance:none;background:rgba(168,85,247,.25);border-radius:2px;outline:none;cursor:pointer}
.vsl::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--p);cursor:pointer;box-shadow:0 0 6px rgba(168,85,247,.7)}
.vsl-val{font-size:10px;color:var(--t2);width:22px;text-align:right;flex-shrink:0}
.vsel{width:100%;margin-top:7px;padding:6px 8px;background:rgba(168,85,247,.1);border:1px solid var(--b2);border-radius:6px;color:#c8aaff;font-size:11px;outline:none;cursor:pointer}
.vsel option{background:#14023a;color:#c8aaff}

/* Welcome */
.welcome{text-align:center;padding:24px 16px;flex-shrink:0}
.wtitle{font-size:30px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--c),var(--p),var(--pk),var(--c));background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:holo 4s linear infinite;filter:drop-shadow(0 0 8px rgba(0,229,255,.3))}
@keyframes holo{0%{background-position:0%}100%{background-position:300%}}
.wsub{font-size:11px;color:var(--t2);margin-top:6px}
.wkey{display:inline-block;margin:14px auto 10px;padding:11px 28px;background:rgba(0,229,255,.12);border:1.5px solid var(--c);color:var(--c);border-radius:25px;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:1px;box-shadow:0 0 22px rgba(0,229,255,.25);transition:all .2s}
.wkey:hover{background:rgba(0,229,255,.22);box-shadow:0 0 35px rgba(0,229,255,.4);transform:scale(1.04)}
.qbtns{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
.qbtn{padding:7px 14px;background:rgba(0,229,255,.06);border:1px solid var(--b);color:var(--c);border-radius:18px;cursor:pointer;transition:all .2s;font-size:11px;font-weight:600}
.qbtn:hover{background:rgba(0,229,255,.18);box-shadow:var(--sc);transform:scale(1.04)}

/* Toast */
.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:rgba(4,15,34,.95);border:1px solid var(--c);border-radius:9px;padding:9px 20px;font-size:12px;color:var(--c);z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:var(--sc)}
.toast.on{opacity:1}

/* ── KEY MODAL ── */
.koverlay{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.9);
  z-index:99999;
  align-items:center;justify-content:center;
  padding:16px;
}
.koverlay.on{display:flex}
.kbox{
  background:#040f22;
  border:1.5px solid var(--c);
  border-radius:14px;
  padding:24px;
  width:100%;max-width:480px;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 0 50px rgba(0,229,255,.2);
  position:relative;
  -webkit-user-select:text;user-select:text;
}
.kbox::-webkit-scrollbar{width:4px}
.kbox::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px}
.khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.khtitle{font-size:16px;color:var(--c);font-weight:700}
.kclose{background:transparent;border:none;color:var(--t2);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.kclose:hover{color:#fff}
.ksaved{font-size:11px;color:#00ff88;background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.25);padding:4px 10px;border-radius:8px}
.kclear{background:rgba(255,60,60,.1);border:1px solid rgba(255,60,60,.3);color:#ff7070;font-size:11px;padding:4px 10px;border-radius:8px;cursor:pointer}
.kclear:hover{background:rgba(255,60,60,.2)}
.krow{background:rgba(0,229,255,.03);border-radius:10px;padding:13px;margin-bottom:11px}
.krow.connected{border:1px solid rgba(0,229,255,.3)}
.krow.disconnected{border:1px solid rgba(255,255,255,.08)}
.krlabel{font-size:13px;font-weight:600;margin-bottom:3px}
.krtip{font-size:11px;color:var(--t2);margin-bottom:9px;line-height:1.5}
.kinputrow{display:flex;gap:7px}
.kinput{
  flex:1;padding:9px 12px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(0,229,255,.3);
  border-radius:7px;color:var(--c);
  font-size:12px;outline:none;
  -webkit-user-select:text;user-select:text;
  cursor:text;
}
.kinput:focus{border-color:var(--c);background:rgba(0,229,255,.06);box-shadow:0 0 0 2px rgba(0,229,255,.1)}
.kinput::placeholder{color:rgba(0,229,255,.25)}
.ksavebtn{padding:9px 16px;background:rgba(0,229,255,.15);border:1px solid var(--c);border-radius:7px;color:var(--c);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.ksavebtn:hover{background:rgba(0,229,255,.28);box-shadow:var(--sc)}
.klink{font-size:10px;color:var(--p);text-decoration:none;display:block;margin-top:7px}
.klink:hover{color:var(--c)}
.kbadge-ok{font-size:10px;color:#00ff88;background:rgba(0,255,136,.1);padding:2px 8px;border-radius:7px;font-weight:700}
.kbadge-no{font-size:10px;color:#ffb800;background:rgba(255,180,0,.1);padding:2px 8px;border-radius:7px;font-weight:700}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="toast" id="toast"></div>

<!-- KEY MODAL -->
<div class="koverlay" id="koverlay">
  <div class="kbox">
    <div class="khead">
      <span class="khtitle">🔑 API Key Manager</span>
      <button class="kclose" id="kcloseBtn">✕</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px">
      <span class="ksaved">💾 Auto-saved in this browser</span>
      <button class="kclear" id="kclearBtn">🗑 Clear All Keys</button>
    </div>
    <div id="kbody"></div>
  </div>
</div>

<div class="app">
  <!-- LEFT -->
  <div class="lp">
    <div class="brand">
      <div class="bname">ASAM</div>
      <div class="bsub">Master AI Agent System</div>
      <div class="bonline"><span class="bdot"></span><span id="statusTxt">Initializing…</span></div>
    </div>
    <div class="ltabs">
      <button class="ltab on" onclick="ltab('agents',this)">⚡ Agents</button>
      <button class="ltab" onclick="ltab('tasks',this)">📋 Tasks</button>
    </div>
    <div class="lbody" id="lbody"></div>
  </div>

  <!-- CENTER -->
  <div class="cc">
    <div class="topbar">
      <div class="tbtitle">⚡ ASAM Command Center</div>
      <div class="tctrls">
        <div class="wavewrap" id="ww"><div class="wbar"></div><div class="wbar"></div><div class="wbar"></div><div class="wbar"></div><div class="wbar"></div></div>
        <div class="vpill" id="vpill" onclick="toggleVoiceOut()"><span class="vpdot" id="vpdot"></span><span id="vpLbl">Voice Off</span></div>
        <button class="tbtn" onclick="stopSpeak()" title="Stop speaking">⏹</button>
        <button class="tbtn" onclick="clearChat()" title="Clear chat">🗑</button>
        <button class="tbtn" id="keyBtn" title="API Keys">🔑</button>
      </div>
    </div>

    <!-- ORB -->
    <div class="orbzone" id="orbzone">
      <div class="orbwrap">
        <canvas id="orbC" width="155" height="155"></canvas>
        <div class="oring"></div><div class="oring2"></div>
        <div class="olabel" id="orbLbl">CLICK TO ACTIVATE</div>
      </div>
    </div>

    <div class="msgs" id="msgs">
      <div class="welcome" id="welcome">
        <div class="wtitle">A S A M</div>
        <div class="wsub">Master AI Agent · 5 Specialized Agents · Voice Enabled</div>
        <button class="wkey" id="wkeyBtn">🔑 ENTER API KEYS TO START</button>
        <div class="qbtns">
          <button class="qbtn" onclick="qcmd('Who are you and what can you do?')">About</button>
          <button class="qbtn" onclick="qcmd('Generate an image of a futuristic city at night')">Image</button>
          <button class="qbtn" onclick="qcmd('Write a Python web scraper')">Code</button>
          <button class="qbtn" onclick="qcmd('Search: latest AI breakthroughs 2025')">Search</button>
          <button class="qbtn" onclick="qcmd('Write a professional bio for a tech CEO')">Write</button>
        </div>
      </div>
    </div>

    <div class="ibar">
      <input id="inp" type="text" placeholder="Give your command to ASAM…"/>
      <button class="ibtn mic" id="micBtn" title="Voice input">🎤</button>
      <button class="ibtn send" id="sendBtn" title="Send">➤</button>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="rp">
    <div class="rphead"><div class="rphtitle">📊 Results Dashboard</div></div>
    <div class="rptabs">
      <button class="rptab on" onclick="rtab('out',this)">Output</button>
      <button class="rptab" onclick="rtab('stats',this)">Stats</button>
      <button class="rptab" onclick="rtab('voice',this)">Voice</button>
    </div>
    <div class="rpbody" id="rpbody"></div>
  </div>
</div>

<script>
'use strict';
// ═══════════════ STATE ═══════════════
const S={
  keys:{anthropic:'',hf:'',serper:'',cohere:''},
  hist:[],voiceOut:false,speaking:false,listening:false,
  agent:'chat',selectedVoice:null,curRtab:'out',
  micOK:!!(window.SpeechRecognition||window.webkitSpeechRecognition),
  ttsOK:!!window.speechSynthesis,rec:null,
  stats:{total:0,img:0,code:0,search:0,doc:0},
  lastOut:{type:'',content:''},respTime:'—'
};
const LS='asam_v2';

// ═══════════════ PERSIST KEYS ═══════════════
function saveKeys(){try{localStorage.setItem(LS,btoa(JSON.stringify(S.keys)))}catch(e){}}
function loadKeys(){
  try{
    const r=localStorage.getItem(LS);
    if(!r)return false;
    const p=JSON.parse(atob(r));
    Object.assign(S.keys,p);
    return!!S.keys.anthropic;
  }catch(e){return false}
}
function clearKeys(){
  localStorage.removeItem(LS);
  S.keys={anthropic:'',hf:'',serper:'',cohere:''};
  toast('🗑 All keys cleared');
  document.getElementById('statusTxt').textContent='Initializing…';
  orbActive(false);
  renderLeft('agents');
  openModal();
}

// ═══════════════ AGENTS / TASKS ═══════════════
const AGENTS=[

// ═══════════════ BACKGROUND NEURAL NET ═══════════════
(function(){
  const cv=document.getElementById('bgCanvas'),cx=cv.getContext('2d');
  let W,H,nodes=[];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;build()}
  function build(){nodes=[];const n=Math.floor(W*H/15000);for(let i=0;i<n;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.6+.5})}
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.strokeStyle='rgba(0,180,255,0.022)';cx.lineWidth=.5;
    for(let x=0;x<W;x+=65){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
    for(let y=0;y<H;y+=65){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.hypot(dx,dy);
      if(d<120){cx.strokeStyle=`rgba(0,229,255,${(1-d/120)*.16})`;cx.lineWidth=.5;cx.beginPath();cx.moveTo(nodes[i].x,nodes[i].y);cx.lineTo(nodes[j].x,nodes[j].y);cx.stroke()}
    }
    nodes.forEach(n=>{cx.beginPath();cx.arc(n.x,n.y,n.r,0,Math.PI*2);cx.fillStyle='rgba(0,229,255,0.5)';cx.fill();n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1});
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);resize();draw();
})();

// ═══════════════ ORB ═══════════════
let orbA=false,orbSp=false,orbT=0;
function orbActive(v){orbA=v}
function orbSpeak(v){orbSp=v}
(function(){
  const cv=document.getElementById('orbC'),cx=cv.getContext('2d');
  const W=155,H=155,cx2=77,cy2=77,r=65;
  function draw(){
    cx.clearRect(0,0,W,H);
    const pulse=orbSp?Math.sin(orbT*.12)*.5+.5:orbA?Math.sin(orbT*.06)*.3+.4:.15;
    const og=cx.createRadialGradient(cx2,cy2,r*.5,cx2,cy2,r*1.35);
    og.addColorStop(0,`rgba(0,229,255,${pulse*.3})`);og.addColorStop(1,'rgba(0,229,255,0)');
    cx.beginPath();cx.arc(cx2,cy2,r*1.35,0,Math.PI*2);cx.fillStyle=og;cx.fill();
    const sg=cx.createRadialGradient(cx2-18,cy2-18,4,cx2,cy2,r);
    sg.addColorStop(0,'rgba(180,240,255,.9)');
    sg.addColorStop(.3,`rgba(0,229,255,${orbA?.72:.35})`);
    sg.addColorStop(.65,`rgba(80,0,200,${orbA?.5:.25})`);
    sg.addColorStop(1,'rgba(2,12,27,.95)');
    cx.beginPath();cx.arc(cx2,cy2,r,0,Math.PI*2);cx.fillStyle=sg;cx.fill();
    cx.save();cx.translate(cx2,cy2);cx.rotate(orbT*.011);
    cx.beginPath();cx.ellipse(0,0,r*.88,r*.22,0,0,Math.PI*2);
    cx.strokeStyle=`rgba(0,229,255,${orbA?.4:.14})`;cx.lineWidth=1.1;cx.stroke();cx.restore();
    cx.save();cx.translate(cx2,cy2);cx.rotate(-orbT*.007);
    cx.beginPath();cx.ellipse(0,0,r*.82,r*.18,Math.PI*.15,0,Math.PI*2);
    cx.strokeStyle=`rgba(168,85,247,${orbA?.3:.1})`;cx.lineWidth=.7;cx.stroke();cx.restore();
    if(orbSp){for(let i=0;i<6;i++){const a=orbT*.05+i*(Math.PI*2/6),sr=r*(.82+Math.sin(orbT*.1+i)*.15);cx.beginPath();cx.arc(cx2+Math.cos(a)*sr,cy2+Math.sin(a)*sr,1.4,0,Math.PI*2);cx.fillStyle=`rgba(0,229,255,${.5+Math.sin(orbT*.1+i)*.4})`;cx.fill()}}
    cx.beginPath();cx.arc(cx2,cy2,r,0,Math.PI*2);cx.strokeStyle=`rgba(0,229,255,${orbA?.38:.12})`;cx.lineWidth=1.3;cx.stroke();
    orbT++;requestAnimationFrame(draw);
  }
  draw();
})();

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(t){

  t=t.replace(/```(\w+)?\n?([\s\S]*?)```/g,(_,l,c)=>`<div style="background:rgba(0,0,0,.55);border:1px solid rgba(0,229,255,.2);border-radius:8px;padding:11px;margin:7px 0;font-family:monospace;font-size:11px;color:#7dd3fc;overflow-x:auto;white-space:pre">${c}</div>`);

// ═══════════════ ROUTING ═══════════════
function route(text){
  if(S.agent!=='chat')return S.agent;
  const t=text.toLowerCase();
  if(/(generate|create|draw|make|show)\s+(an?\s+)?(image|picture|photo|art|painting)/i.test(t))return'image';
  if(/^(search|find|look up|latest|news|who is|when did|what happened)/i.test(t))return'search';
  if(/(write|fix|debug|code|script|function|class|python|javascript|html|css|sql)/i.test(t)&&/(code|script|function|class|debug|python|javascript|html|css)/i.test(t))return'code';
  if(/(write|draft|compose|create)\s+(a|an|the)?\s*(email|letter|report|essay|document|bio|proposal|article|blog)/i.test(t))return'write';
  return'chat';
}

async function send(){
  if(!S.keys.anthropic){openModal();toast('⚠️ Add your Anthropic key first');return}
  const inp=document.getElementById('inp');
  const text=inp.value.trim();if(!text)return;
  inp.value='';stopSpeak();rmWelcome();
  addMsg(text,'user');S.stats.total++;
  document.getElementById('statusTxt').textContent='Processing…';
  document.getElementById('sendBtn').disabled=true;
  showTyping();
  const t0=Date.now();
  const agId=route(text);
  const ag=AGENTS.find(a=>a.id===agId)||AGENTS[0];
  setAgent(agId);
  try{
    if(agId==='image'){await doImage(text,ag,t0)}
    else if(agId==='search'){await doSearch(text,ag,t0)}
    else{await doClaude(text,ag,t0)}
  }catch(e){
    hideTyping();
    addMsg('⚠️ Error: '+e.message,'ai',ag);
    document.getElementById('statusTxt').textContent='Error';
  }
  document.getElementById('sendBtn').disabled=false;
}

async function doClaude(text,ag,t0){
  S.hist.push({role:'user',content:text});
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.keys.anthropic,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,system:ag.sys,messages:S.hist})
  });
  const d=await res.json();hideTyping();
  if(d.content&&d.content[0]){
    const r=d.content[0].text;
    S.hist.push({role:'assistant',content:r});
    addMsg(r,'ai',ag,true);
    S.respTime=((Date.now()-t0)/1000).toFixed(1)+'s';
    S.lastOut={type:ag.id==='code'?'Code':'Text',content:r};
    if(ag.id==='code')S.stats.code++;
    if(ag.id==='write')S.stats.doc++;
    document.getElementById('statusTxt').textContent='Online & Ready';
    renderRight();
  } else {
    const msg='API Error: '+(d.error?.message||JSON.stringify(d));
    addMsg(msg,'ai',ag);document.getElementById('statusTxt').textContent='API Error';
    throw new Error(msg);
  }
}

async function doSearch(text,ag,t0){

    hideTyping();
    addMsg("I need a Serper API key for web search! Click 🔑 and add your free key from serper.dev\n\nAnswering from my knowledge instead:",'ai',ag,false);
    S.hist.push({role:'user',content:text});
    await doClaude(text,AGENTS[0],t0);return;

      headers:{'X-API-KEY':S.keys.serper,'Content-Type':'application/json'},
      body:JSON.stringify({q:text.replace(/^search:\s*/i,''),num:6})});
    const sd=await sr.json();
    let ctx='Web search results:\n';
    if(sd.answerBox)ctx+=`Answer: ${sd.answerBox.answer||sd.answerBox.snippet}\n\n`;
    if(sd.organic)sd.organic.slice(0,5).forEach(r=>{ctx+=`• ${r.title}: ${r.snippet} [${r.link}]\n`});

  }catch(e){hideTyping();addMsg('Search error: '+e.message,'ai',ag);renderRight()}

function qcmd(cmd){document.getElementById('inp').value=cmd;if(cmd&&!cmd.endsWith(': '))send();else document.getElementById('inp').focus()}

// ═══════════════ VOICE INPUT ═══════════════
function initMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){S.micOK=false;return}
  S.rec=new SR();S.rec.continuous=false;S.rec.interimResults=true;S.rec.lang='en-US';
  S.rec.onstart=()=>{S.listening=true;document.getElementById('micBtn').classList.add('on');document.getElementById('inp').classList.add('micon');document.getElementById('inp').placeholder='🎤 Listening…';orbActive(true)};
  S.rec.onresult=e=>{let f='',n='';for(let i=e.resultIndex;i<e.results.length;i++){(e.results[i].isFinal?f:n)+=e.results[i][0].transcript}document.getElementById('inp').value=f||n};
  S.rec.onend=()=>{
    S.listening=false;document.getElementById('micBtn').classList.remove('on');
    document.getElementById('inp').classList.remove('micon');document.getElementById('inp').placeholder='Give your command to ASAM…';
    if(!S.voiceOut)orbActive(!!S.keys.anthropic);
    const v=document.getElementById('inp').value.trim();if(v)setTimeout(send,350);
  };
  S.rec.onerror=e=>{
    S.listening=false;document.getElementById('micBtn').classList.remove('on');document.getElementById('inp').classList.remove('micon');document.getElementById('inp').placeholder='Give your command to ASAM…';
    const m={'not-allowed':'🎤 Allow microphone in browser settings','no-speech':'No speech detected','network':'Network error'};
    toast(m[e.error]||'Mic error: '+e.error);
  };
}
function toggleMic(){
  if(!S.micOK){toast('Voice input needs Chrome or Edge');return}
  S.listening?S.rec.stop():S.rec.start();
}

// ═══════════════ VOICE OUTPUT ═══════════════
function toggleVoiceOut(){
  if(!S.ttsOK){toast('TTS not supported here — try Chrome');return}
  S.voiceOut=!S.voiceOut;
  const pill=document.getElementById('vpill');
  document.getElementById('vpLbl').textContent=S.voiceOut?'Voice On':'Voice Off';
  pill.className='vpill'+(S.voiceOut?' on':'');
  if(S.voiceOut){
    rtab('voice',document.querySelectorAll('.rptab')[2]);
    speakText(null,"Hello! I'm ASAM, your Master AI Agent. Voice output is now active. I'm ready for your commands.");
  } else stopSpeak();
}
function speakText(btn,text){
  if(!S.ttsOK)return;stopSpeak();
  const clean=text.replace(/```[\s\S]*?```/g,'code block').replace(/[*_`#]/g,'').replace(/\n+/g,' ').trim();
  if(!clean)return;
  const u=new SpeechSynthesisUtterance(clean);
  u.rate=parseFloat(document.getElementById('rateS')?.value||1);
  u.pitch=parseFloat(document.getElementById('pitchS')?.value||1.1);
  u.volume=parseFloat(document.getElementById('volS')?.value||1);
  if(S.selectedVoice)u.voice=S.selectedVoice;
  else{const f=speechSynthesis.getVoices().find(v=>/samantha|karen|victoria|zira|fiona|moira/i.test(v.name)&&v.lang.startsWith('en'));if(f)u.voice=f}
  u.onstart=()=>{S.speaking=true;orbActive(true);orbSpeak(true);document.getElementById('ww').classList.add('on');if(btn)btn.classList.add('on')};
  u.onend=u.onerror=()=>{S.speaking=false;orbSpeak(false);document.getElementById('ww').classList.remove('on');if(!S.voiceOut&&!S.listening)orbActive(!!S.keys.anthropic);if(btn)btn.classList.remove('on')};
  speechSynthesis.speak(u);
}
function stopSpeak(){
  if(window.speechSynthesis)speechSynthesis.cancel();
  S.speaking=false;orbSpeak(false);document.getElementById('ww').classList.remove('on');
  document.querySelectorAll('.rbtn.on').forEach(b=>b.classList.remove('on'));
}

// ═══════════════ UTILS ═══════════════
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200);
}

// ═══════════════ EVENT LISTENERS ═══════════════
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.getElementById('sendBtn').addEventListener('click',send);
document.getElementById('micBtn').addEventListener('click',toggleMic);
document.getElementById('keyBtn').addEventListener('click',openModal);
document.getElementById('wkeyBtn').addEventListener('click',openModal);
document.getElementById('kcloseBtn').addEventListener('click',closeModal);
document.getElementById('kclearBtn').addEventListener('click',clearKeys);
// Close modal when clicking outside the box
document.getElementById('koverlay').addEventListener('click',function(e){if(e.target===this)closeModal()});

// ═══════════════ BOOT ═══════════════
function boot(){
  renderLeft('agents');renderRight();initMic();
  if(S.ttsOK)speechSynthesis.getVoices();
  setTimeout(()=>{
    const had=loadKeys();
    if(had){
      document.getElementById('statusTxt').textContent='Online & Ready';
      orbActive(true);renderLeft('agents');
      toast('🔑 Keys restored — Welcome back!');
      addMsg("Welcome back! I'm ASAM, your Master AI Agent. All systems online. How can I help you today?",'ai',AGENTS[0],false);
    } else {
      openModal();
    }
  },700);
}
boot();
</script>
